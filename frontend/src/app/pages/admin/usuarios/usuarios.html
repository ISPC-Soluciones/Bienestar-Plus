<section class="usuarios-admin">
    <h1>Usuarios</h1>
  
    @if (cargando) {
      <p>Cargando usuarios...</p>
    } @else {
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
  
        <tbody>
          @for (usuario of usuarios; track usuario.id) {
            <tr>
              <td>{{ usuario.id }}</td>
              <td>{{ usuario.nombre }}</td>
              <td>{{ usuario.email }}</td>
              <td>{{ usuario.rol }}</td>
              <td>{{ usuario.telefono || "-" }}</td>
  
              <td>
                <button
                  type="button"
                  (click)="eliminarUsuario(usuario)"
                >
                  Eliminar
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
