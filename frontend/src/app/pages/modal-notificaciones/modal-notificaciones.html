<div class="modal-fondo" [class.visible]="abierto">
  <div class="modal-contenido">

    <div class="modal-header">
      <h2 class="modal-titulo">Tus notificaciones</h2>

      <button
        class="modal-cerrar"
        (click)="cerrarClick()"
        aria-label="Cerrar notificaciones">
        x
      </button>
    </div>

    @if (notificaciones.length > 0) {

      <ul class="notificaciones-lista">

        @for (noti of notificaciones; track noti.id) {

          <li
            class="notificacion"
            [class.no-leida]="noti.estado !== 'leido'"
            [class.leida]="noti.estado === 'leido'"
            (click)="toggleLeida(noti)">

            <div class="notificacion-indicador">
              <span></span>
            </div>

            <div class="mensaje-container">
              <p class="mensaje-texto">
                {{ noti.mensaje }}
              </p>

              <small class="mensaje-fecha">
                {{ noti.enviado | date:'short' }}
              </small>
            </div>

          </li>

        }

      </ul>

    } @else {

      <div class="modal-vacio">
        <p>No tenés notificaciones por el momento.</p>
      </div>

    }
  </div>
</div>
