<header>
  <nav class="navbar">
    <a routerLink="/" class="logo">
      <img src="assets/isotipo-colo.png" alt="Logo BienestarPlus" />
      <span>BienestarPlus</span>
    </a>

    <input type="checkbox" id="menu-toggle" />
    <label for="menu-toggle" class="hamburger">&#9776;</label>

    <ul class="nav-links">
      <li><a routerLink="/" class="nav-registrarse">Inicio</a></li>
      <li><a routerLink="/nosotros" class="nav-registrarse">Nosotros</a></li>

      @if (!(userId$ | async)) {
        <li><a routerLink="/registro" class="nav-registrarse">Registrarse</a></li>
        <li><a routerLink="/login" class="nav-registrarse">Iniciar Sesión</a></li>
      }

      @if (userId$ | async; as userId) {
        <li><a [routerLink]="['/perfil', userId]" class="nav-registrarse">Perfil</a></li>
        <li><a routerLink="/habitos" class="nav-registrarse">Hábitos</a></li>
        <li>
          <button class="nav-registrarse nav-notifications-btn" (click)="abrirModalNotificaciones(userId)">
            🔔 Notificaciones
            @if (notificacionesSinLeer > 0) {
              <span class="notification-badge">{{ notificacionesSinLeer }}</span>
            }
          </button>
        </li>
      }
    </ul>
  </nav>
</header>

@if (modalNotificacionesAbierto) {
  <app-modal-notificaciones
    [abierto]="modalNotificacionesAbierto"
    [notificaciones]="notificaciones"
    (cerrar)="cerrarModalNotificaciones()"
    (notificacionesCambiaron)="onNotificacionesCambiaron()">
  </app-modal-notificaciones>
}
