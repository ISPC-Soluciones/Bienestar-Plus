name: Pruebas de regresión

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Instalar dependencias
        run: pip install -r requirements-test.txt

      - name: Ejecutar tests con cobertura
        run: coverage run manage.py test bienestar --verbosity 2

      - name: Generar reporte HTML de cobertura
        if: always()
        run: coverage html -d coverage-backend

      - name: Mostrar cobertura
        if: always()
        run: coverage report

      - name: Publicar cobertura backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage-backend
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Publicar cobertura frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          retention-days: 14

      - name: Compilar aplicación
        run: npx ng build --configuration development

